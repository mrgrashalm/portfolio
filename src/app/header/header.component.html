<header class="header" [class.open]="menuOpen">
    <div class="wrap bar">
        <a class="brand" routerLink="/" (click)="closeMenu()">
            <img src="assets/logo.svg" alt="">
            <span>Marian Mannert</span>
        </a>

        <nav class="nav" id="main-nav">
            <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">
                {{ link.label }}
            </a>
            <a class="btn btn-primary nav-cta" routerLink="/contact" (click)="closeMenu()">Projekt anfragen</a>
        </nav>

        <button class="burger" type="button" aria-controls="main-nav" [attr.aria-expanded]="menuOpen"
            [attr.aria-label]="menuOpen ? 'Menü schließen' : 'Menü öffnen'" (click)="menuOpen = !menuOpen">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
